<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOC 监控台 · Server Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============================================================
   NOC — 运维监控大屏
   深海军蓝黑 + 青色，数据指标墙，固定暗色
   ============================================================ */
:root {
  --bg:        #0a0e17;   /* 深海军蓝黑 */
  --bg-deep:   #060910;
  --panel:     #101826;
  --panel-2:   #16202f;
  --line:      #1c2939;
  --line-hi:   #2b3d55;
  --text:      #dbe4f0;
  --text-2:    #8fa3bf;
  --text-3:    #4c5f7a;
  --cyan:      #22d3ee;   /* NOC 青 */
  --cyan-dim:  rgba(34,211,238,0.08);
  --green:     #34d399;
  --green-bg:  rgba(52,211,153,0.10);
  --amber:     #fbbf24;
  --amber-bg:  rgba(251,191,36,0.10);
  --red:       #f87171;
  --red-bg:    rgba(248,113,113,0.10);
  --blue:      #60a5fa;
  --purple:    #a78bfa;
  --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', 'PingFang SC', 'Microsoft YaHei', monospace;
  --ease: 160ms cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:        #070a12;
  --bg-deep:   #04060a;
  --panel:     #0c1320;
  --panel-2:   #111a2a;
  --line:      #16202e;
  --line-hi:   #22324a;
  --text:      #c9d6e6;
  --text-2:    #778aa6;
  --text-3:    #3d4e66;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:var(--mono);
  background:
    radial-gradient(ellipse 70% 40% at 80% -10%, rgba(34,211,238,0.05), transparent),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--cyan);color:#031018}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-hi)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* 背景网格 */
.bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:52px 52px;
  opacity:0.4;
}

/* ============================================================
   Header — 监控状态条
   ============================================================ */
.header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:0 22px;
  background:rgba(10,14,23,0.92);
  border-bottom:1px solid var(--line-hi);
}
.header-left{display:flex;align-items:center;gap:14px;min-width:0}
.back-btn{
  width:30px;height:30px;flex-shrink:0;
  border:1px solid var(--line-hi);background:var(--panel);
  color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:all var(--ease);
}
.back-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.back-btn svg{width:14px;height:14px}
.header-title{
  font-size:13px;font-weight:800;letter-spacing:0.16em;
  color:var(--text);white-space:nowrap;
}
.header-title .tag{
  display:inline-block;margin-left:10px;padding:2px 9px;
  font-size:9px;letter-spacing:0.2em;font-weight:700;
  color:var(--green);border:1px solid rgba(52,211,153,0.4);
  background:var(--green-bg);vertical-align:2px;
}
.header-sub{font-size:10px;color:var(--text-3);letter-spacing:0.2em;text-transform:uppercase;white-space:nowrap;margin-left:8px}
.header-right{display:flex;align-items:center;gap:10px}
.header-time{
  font-size:12px;color:var(--cyan);letter-spacing:0.12em;
  background:var(--panel);border:1px solid var(--line);
  padding:5px 12px;font-variant-numeric:tabular-nums;
}
.theme-toggle{
  width:30px;height:30px;border:1px solid var(--line-hi);background:var(--panel);
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--ease);
}
.theme-toggle:hover{border-color:var(--cyan);color:var(--cyan)}
.theme-toggle svg{width:14px;height:14px}

/* ============================================================
   Main
   ============================================================ */
.main{
  position:relative;z-index:1;
  max-width:1080px;margin:0 auto;padding:32px 22px 60px;
}

/* ---- Page header ---- */
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:26px;flex-wrap:wrap;gap:12px;
}
.page-header h1{
  font-size:16px;font-weight:800;letter-spacing:0.1em;
  display:flex;align-items:center;gap:12px;color:var(--text);
}
.page-header h1 .icon{
  width:34px;height:34px;border:1px solid var(--line-hi);
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  color:var(--cyan);
}
.page-header h1 .icon svg{width:17px;height:17px}
.status-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:0.1em;
  border:1px solid var(--line-hi);
}
.status-badge.online{background:var(--green-bg);color:var(--green);border-color:rgba(52,211,153,0.35)}
.status-badge.offline{background:var(--amber-bg);color:var(--amber);border-color:rgba(251,191,36,0.35)}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;animation:pulse 2s ease-in-out infinite}
.status-dot.online{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,0.6)}
.status-dot.offline{background:var(--amber);box-shadow:0 0 8px rgba(251,191,36,0.6)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* ---- 指标卡片墙 ---- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:20px 22px 18px;
  transition:all var(--ease);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  opacity:0.75;
}
.card-cpu::before{background:var(--blue)}
.card-mem::before{background:var(--green)}
.card-dsk::before{background:var(--amber)}
.card-load::before{background:var(--purple)}
.card:hover{border-color:var(--line-hi);transform:translateY(-2px)}
.card .label{
  font-size:9px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.18em;margin-bottom:10px;
}
.card .value{
  font-size:32px;font-weight:800;line-height:1;
  display:flex;align-items:baseline;gap:6px;
  font-variant-numeric:tabular-nums;
}
.card .value .unit{font-size:13px;font-weight:600;color:var(--text-3)}
.card-cpu .value{color:var(--blue);text-shadow:0 0 20px rgba(96,165,250,0.25)}
.card-mem .value{color:var(--green);text-shadow:0 0 20px rgba(52,211,153,0.25)}
.card-dsk .value{color:var(--amber);text-shadow:0 0 20px rgba(251,191,36,0.25)}
.card-load .value{color:var(--purple);text-shadow:0 0 20px rgba(167,139,250,0.25)}
.card .sub{font-size:11px;color:var(--text-3);margin-top:8px}
.card .sub .num{color:var(--text-2);font-weight:600}
.card .progress-bar{
  width:100%;height:5px;background:var(--bg-deep);
  margin-top:14px;overflow:hidden;border:1px solid var(--line);
}
.card .progress-bar .fill{height:100%;transition:width 0.5s ease}
.fill-low{background:var(--green)}
.fill-mid{background:var(--amber)}
.fill-high{background:var(--red)}

/* ---- 图表区 ---- */
.chart-section{
  background:var(--panel);
  border:1px solid var(--line);
  padding:20px 22px;
  transition:border-color var(--ease);
}
.chart-section:hover{border-color:var(--line-hi)}
.chart-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.chart-header h3{
  font-size:13px;font-weight:800;letter-spacing:0.06em;
  display:flex;align-items:center;gap:8px;color:var(--text);
}
.chart-header h3 svg{width:15px;height:15px;color:var(--cyan)}
.chart-tabs{display:flex;gap:2px;background:var(--bg-deep);padding:3px;border:1px solid var(--line)}
.chart-tabs .tab{
  padding:4px 13px;font-size:11px;font-weight:700;cursor:pointer;
  border:none;background:transparent;color:var(--text-3);
  transition:all var(--ease);white-space:nowrap;font-family:var(--mono);
}
.chart-tabs .tab.active{
  background:var(--cyan);color:#031018;
  box-shadow:0 0 12px rgba(34,211,238,0.3);
}
.chart-tabs .tab:hover:not(.active){color:var(--text)}
.chart-box{width:100%;height:320px;min-height:320px;position:relative}
.chart-box svg{width:100%;height:100%;display:block}

/* ---- 信息栏 ---- */
.info-bar{
  display:flex;align-items:center;gap:16px;
  margin-top:14px;padding:12px 16px;
  background:var(--bg-deep);border:1px solid var(--line);
  font-size:11px;color:var(--text-3);flex-wrap:wrap;
  font-family:var(--mono);
}
.info-bar svg{width:13px;height:13px;color:var(--cyan);flex-shrink:0}
.info-bar span{display:flex;align-items:center;gap:4px}
.info-bar .sep{width:1px;height:12px;background:var(--line-hi)}
.info-bar strong{color:var(--amber);font-weight:700}
.info-bar a{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border:1px solid var(--line);
  color:var(--text-3);text-decoration:none;font-size:10px;
  transition:all var(--ease);
}
.info-bar a:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.info-bar button{
  padding:4px 10px;border:1px solid var(--line);
  background:transparent;color:var(--text-3);font-size:10px;
  cursor:pointer;transition:all var(--ease);
  display:flex;align-items:center;gap:4px;font-family:var(--mono);
}
.info-bar button:hover{border-color:var(--red);color:var(--red)}

/* ---- Footer ---- */
.footer{
  position:relative;z-index:1;text-align:center;
  padding:28px;font-size:11px;color:var(--text-3);letter-spacing:0.08em;
}
.footer a{color:var(--cyan);text-decoration:none;font-weight:700;transition:opacity var(--ease)}
.footer a:hover{opacity:0.8}

/* ---- Responsive ---- */
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .header-sub{display:none}
  .main{padding:24px 14px 50px}
}
@media(max-width:640px){
  .header{padding:0 14px}
  .header-time{font-size:11px}
  .page-header{flex-direction:column;align-items:flex-start;gap:10px}
  .cards{grid-template-columns:1fr;gap:10px}
  .card{padding:16px 18px}
  .card .value{font-size:26px}
  .chart-section{padding:14px}
  .info-bar{gap:6px;font-size:10px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div id="app">
  <header class="header">
    <div class="header-left">
      <a class="back-btn" href="/" title="返回首页" aria-label="返回首页" style="text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <span class="header-title">NOC CONSOLE<span class="tag">MONITOR</span></span>
      <span class="header-sub">运维监控台</span>
    </div>
    <div class="header-right">
      <span class="header-time" id="clock"></span>
      <button class="theme-toggle" id="themeToggle" title="切换终端亮度">
        <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="main">
    <div class="page-header">
      <h1>
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </span>
        服务器监控 / SERVER MONITOR
      </h1>
      <div class="status-badge online" id="statusBadge">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">在线</span>
      </div>
    </div>

    <div class="cards">
      <div class="card card-cpu">
        <div class="label">CPU 使用率</div>
        <div class="value"><span id="cpuVal">--</span><span class="unit">%</span></div>
        <div class="sub">2 核</div>
        <div class="progress-bar"><div class="fill" id="cpuBar" style="width:0%"></div></div>
      </div>
      <div class="card card-mem">
        <div class="label">内存使用率</div>
        <div class="value"><span id="memVal">--</span><span class="unit">%</span></div>
        <div class="sub"><span class="num" id="memUsed">--</span> / <span class="num" id="memTotal">--</span> GB</div>
        <div class="progress-bar"><div class="fill" id="memBar" style="width:0%"></div></div>
      </div>
      <div class="card card-dsk">
        <div class="label">磁盘使用率</div>
        <div class="value"><span id="dskVal">--</span><span class="unit">%</span></div>
        <div class="sub"><span class="num" id="dskUsed">--</span> / <span class="num" id="dskTotal">--</span> GB</div>
        <div class="progress-bar"><div class="fill" id="dskBar" style="width:0%"></div></div>
      </div>
      <div class="card card-load">
        <div class="label">系统负载 (1min)</div>
        <div class="value"><span id="loadVal">--</span></div>
        <div class="sub">2 核</div>
        <div class="progress-bar"><div class="fill" id="loadBar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          趋势图表 / TREND
        </h3>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div class="chart-tabs" id="timeRangeTabs">
            <button class="tab active" data-hours="1">1 小时</button>
            <button class="tab" data-hours="6">6 小时</button>
            <button class="tab" data-hours="24">24 小时</button>
            <button class="tab" data-hours="168">7 天</button>
          </div>
          <div class="chart-tabs" id="chartTabs">
            <button class="tab active" data-field="cpu">CPU</button>
            <button class="tab" data-field="mem">内存</button>
            <button class="tab" data-field="dsk">磁盘</button>
            <button class="tab" data-field="load">负载</button>
            <button class="tab" data-field="all">全部</button>
          </div>
        </div>
      </div>
      <div class="chart-box" id="trendChart">
        <svg id="chartSvg" viewBox="0 0 900 300" preserveAspectRatio="none" style="width:100%;height:100%"></svg>
      </div>
    </div>

    <div class="info-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>每 30 秒采集一次</span>
      <span class="sep"></span>
      <span>ECS · 47.116.57.142</span>
      <span class="sep"></span>
      <span>最后更新: <strong id="lastUpdate">--:--:--</strong></span>
      <span style="flex:1"></span>
      <a href="https://home.console.aliyun.com/home/dashboard/" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        阿里云
      </a>
      <button id="cleanupBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清理旧数据
      </button>
    </div>
  </div>

  <div class="footer">
    <a href="/">← 返回 Hermes Study</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== 暗色主题（NOC 固定暗色，两档亮度） =====
  var theme = localStorage.getItem('hermes-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');

  // ===== 时钟 =====
  function updateClock() {
    var now = new Date();
    document.getElementById('clock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== 状态 =====
  var currentField = 'cpu';
  var currentHours = 1;
  var historyData = [];
  var COLORS = {
    cpu: '#2563eb', mem: '#1db954', dsk: '#f59e0b', load: '#7c3aed'
  };

  // ===== 工具 =====
  function fmtPercent(v) { return v != null ? v.toFixed(1) : '--'; }
  function fmtGb(kb) { return kb != null ? (kb / 1024 / 1024).toFixed(1) : '--'; }
  function fmtTime(iso) {
    if (!iso) return '--:--:--';
    var d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' +
           String(d.getMinutes()).padStart(2,'0') + ':' +
           String(d.getSeconds()).padStart(2,'0');
  }
  /* X 轴标签：跨天（>6h）显示 月-日 时:分，短时段只显示 时:分 */
  function fmtAxisTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    if (currentHours > 6) {
      var md = String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      return md + ' ' + hh + ':' + mm;
    }
    return hh + ':' + mm;
  }

  // ===== SVG 图表渲染 =====
  var MARGIN = { top: 10, right: 20, bottom: 30, left: 50 };
  var SVG_W = 900, SVG_H = 300;

  function renderChart(field, data) {
    var svg = document.getElementById('chartSvg');
    if (!svg || data.length === 0) return;

    // 降采样：超过 600 点等间隔抽样（保留首尾），保证大数据量流畅
    if (data.length > 600) {
      var step = data.length / 600;
      var sampled = [];
      for (var si = 0; si < data.length; si += step) {
        sampled.push(data[Math.floor(si)]);
      }
      if (sampled[sampled.length - 1] !== data[data.length - 1]) sampled.push(data[data.length - 1]);
      data = sampled;
    }

    // 清空
    svg.innerHTML = '';

    var plotW = SVG_W - MARGIN.left - MARGIN.right;
    var plotH = SVG_H - MARGIN.top - MARGIN.bottom;

    // 确定要画的字段
    var fields = [];
    if (field === 'all') {
      fields = [{key:'cpu_usage',name:'CPU',color:COLORS.cpu},
                {key:'memory_usage',name:'内存',color:COLORS.mem},
                {key:'disk_usage',name:'磁盘',color:COLORS.dsk},
                {key:'load_average',name:'负载',color:COLORS.load}];
    } else {
      var keyMap = {cpu:'cpu_usage', mem:'memory_usage', dsk:'disk_usage', load:'load_average'};
      var nameMap = {cpu:'CPU', mem:'内存', dsk:'磁盘', load:'负载'};
      fields = [{key:keyMap[field], name:nameMap[field], color:COLORS[field]}];
    }

    // 计算数据范围
    var allVals = [];
    fields.forEach(function(f) {
      data.forEach(function(d) {
        var v = d[f.key];
        if (v != null) allVals.push(+v);
      });
    });
    if (allVals.length === 0) { svg.innerHTML = '<text x="450" y="150" text-anchor="middle" fill="#4c5f7a" font-size="13">NO DATA</text>'; return; }

    var yMin = Math.min.apply(null, allVals);
    var yMax = Math.max.apply(null, allVals);
    if (yMax === yMin) { yMax = yMin + 10; }
    var yRange = yMax - yMin;
    yMin = Math.max(0, yMin - yRange * 0.1);
    yMax = yMax + yRange * 0.1;

    // 时间标签
    var times = data.map(function(d) { return fmtAxisTime(d.created_at); });

    // 画网格线 (水平)
    var gridLines = 5;
    var ns = document.createDocumentFragment();
    for (var i = 0; i <= gridLines; i++) {
      var y = MARGIN.top + (plotH / gridLines) * i;
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', MARGIN.left);
      line.setAttribute('y1', y);
      line.setAttribute('x2', SVG_W - MARGIN.right);
      line.setAttribute('y2', y);
      line.setAttribute('stroke', 'var(--line)');
      line.setAttribute('stroke-width', '1');
      ns.appendChild(line);

      var val = yMax - (yMax - yMin) * i / gridLines;
      var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', MARGIN.left - 8);
      label.setAttribute('y', y + 4);
      label.setAttribute('text-anchor', 'end');
      label.setAttribute('fill', '#5c6f8a');
      label.setAttribute('font-size', '11');
      label.textContent = field === 'load' && fields.length === 1 ? val.toFixed(1) : Math.round(val);
      ns.appendChild(label);
    }

    // 画数据线：X 轴按选定时间范围映射
    // 数据不足时数据线只占右侧，但刻度覆盖完整选定时段（7天能看到完整日期轴）
    var latestT = new Date(data[data.length - 1].created_at).getTime();
    var xMinT = latestT - currentHours * 3600 * 1000;
    var xMaxT = latestT;
    function xPos(t) { return MARGIN.left + (t - xMinT) / (xMaxT - xMinT) * plotW; }
    function yPos(v) { return MARGIN.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH; }

    fields.forEach(function(f) {
      var pts = [];
      data.forEach(function(d) {
        var v = d[f.key];
        if (v == null) return;
        pts.push({ x: xPos(new Date(d.created_at).getTime()), y: yPos(+v) });
      });
      if (pts.length < 2) return;

      // 面积填充
      var areaD = 'M' + pts[0].x + ',' + (MARGIN.top + plotH);
      pts.forEach(function(p) { areaD += 'L' + p.x + ',' + p.y; });
      areaD += 'L' + pts[pts.length-1].x + ',' + (MARGIN.top + plotH) + 'Z';
      var area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      area.setAttribute('d', areaD);
      area.setAttribute('fill', f.color);
      area.setAttribute('opacity', '0.12');
      ns.appendChild(area);

      // 线
      var lineD = 'M' + pts[0].x + ',' + pts[0].y;
      for (var j = 1; j < pts.length; j++) {
        lineD += 'L' + pts[j].x + ',' + pts[j].y;
      }
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', lineD);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', f.color);
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-linejoin', 'round');
      ns.appendChild(line);

      // 数据点（最新一个加圆点）
      var last = pts[pts.length-1];
      var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', last.x);
      dot.setAttribute('cy', last.y);
      dot.setAttribute('r', '3.5');
      dot.setAttribute('fill', '#0a0e17');
      dot.setAttribute('stroke', f.color);
      dot.setAttribute('stroke-width', '2');
      ns.appendChild(dot);
    });

    // x轴时间刻度：按选定时间范围均匀分布（跨天显示日期）
    var tickCount = Math.min(10, Math.max(5, Math.floor(plotW / 90)));
    for (var k = 0; k <= tickCount; k++) {
      var tt = xMinT + (xMaxT - xMinT) * k / tickCount;
      var xl = xPos(tt);
      var lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', xl);
      lbl.setAttribute('y', SVG_H - 5);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('fill', '#5c6f8a');
      lbl.setAttribute('font-size', '10');
      lbl.textContent = fmtAxisTime(new Date(tt).toISOString());
      ns.appendChild(lbl);
    }

    svg.appendChild(ns);
  }

  // ===== 渲染指标卡片 =====
  function renderCurrent(m) {
    if (!m) return;
    document.getElementById('cpuVal').textContent = fmtPercent(m.cpu_usage);
    document.getElementById('memVal').textContent = fmtPercent(m.memory_usage);
    document.getElementById('dskVal').textContent = fmtPercent(m.disk_usage);
    document.getElementById('loadVal').textContent = m.load_average != null ? m.load_average.toFixed(2) : '--';
    document.getElementById('memUsed').textContent = fmtGb(m.memory_used);
    document.getElementById('memTotal').textContent = fmtGb(m.memory_total);
    document.getElementById('dskUsed').textContent = fmtGb(m.disk_used);
    document.getElementById('dskTotal').textContent = fmtGb(m.disk_total);
    var cpuPct = Math.min(m.cpu_usage || 0, 100);
    var memPct = Math.min(m.memory_usage || 0, 100);
    var dskPct = Math.min(m.disk_usage || 0, 100);
    var loadPct = Math.min((m.load_average || 0) * 50, 100);
    document.getElementById('cpuBar').style.width = cpuPct + '%';
    document.getElementById('cpuBar').className = 'fill ' + (cpuPct < 60 ? 'fill-low' : cpuPct < 80 ? 'fill-mid' : 'fill-high');
    document.getElementById('memBar').style.width = memPct + '%';
    document.getElementById('memBar').className = 'fill ' + (memPct < 60 ? 'fill-low' : memPct < 80 ? 'fill-mid' : 'fill-high');
    document.getElementById('dskBar').style.width = dskPct + '%';
    document.getElementById('dskBar').className = 'fill ' + (dskPct < 60 ? 'fill-low' : dskPct < 80 ? 'fill-mid' : 'fill-high');
    document.getElementById('loadBar').style.width = loadPct + '%';
    document.getElementById('loadBar').className = 'fill ' + (loadPct < 60 ? 'fill-low' : loadPct < 80 ? 'fill-mid' : 'fill-high');
    document.getElementById('lastUpdate').textContent = fmtTime(m.created_at);
  }

  function setOnline(online) {
    document.getElementById('statusBadge').className = 'status-badge ' + (online ? 'online' : 'offline');
    document.getElementById('statusDot').className = 'status-dot ' + (online ? 'online' : 'offline');
    document.getElementById('statusText').textContent = online ? '在线' : '离线';
  }

  // ===== 数据加载 =====
  function loadData() {
    fetch('/api/monitor/current')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.code === 0 && d.data) {
          renderCurrent(d.data);
          setOnline(true);
        } else { setOnline(false); }
      })
      .catch(function() { setOnline(false); });
  }

  function loadHistory() {
    fetch('/api/monitor/history?hours=' + currentHours)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.code === 0) {
          historyData = d.data || [];
          renderChart(currentField, historyData);
        }
      })
      .catch(function() {});
  }

  // ===== 事件绑定 =====
  document.querySelectorAll('#timeRangeTabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#timeRangeTabs .tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentHours = parseInt(this.dataset.hours);
      loadHistory();
    });
  });

  document.querySelectorAll('#chartTabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#chartTabs .tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentField = this.dataset.field;
      renderChart(currentField, historyData);
    });
  });

  document.getElementById('cleanupBtn').addEventListener('click', function() {
    if (!confirm('确定清理全部历史监控数据？')) return;
    fetch('/api/monitor/cleanup', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.code === 0) { historyData = []; renderChart(currentField, []); }
      })
      .catch(function() {});
  });

  // ===== 启动 =====
  loadData();
  loadHistory();
  setInterval(loadData, 30000);
})();
</script>
</body>
</html>
