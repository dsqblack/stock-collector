<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股市情报站 · Market Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============================================================
   Market Dashboard — Tableau 浅色数据仪表盘
   #f3f5f8 画布 + 白卡 + 蓝 #1176b6，A股红涨绿跌
   ============================================================ */
:root {
  --canvas:      #f3f5f8;   /* Tableau 画布 */
  --canvas-deep: #e8ecf1;
  --card:        #ffffff;
  --hover:       #f2f5f8;
  --line:        #e3e8ee;
  --line-strong: #c9d2dc;
  --text:        #1d2733;
  --text-2:      #5c6b7a;
  --text-3:      #97a3b0;
  --blue:        #1176b6;   /* Tableau 蓝 */
  --blue-light:  rgba(17,118,182,0.07);
  --blue-soft:   #e6f1f8;
  --rise:        #e74c3c;   /* 涨·红 (A股) */
  --rise-bg:     rgba(231,76,60,0.07);
  --rise-soft:   #fdecea;
  --fall:        #1e9e5c;   /* 跌·绿 (A股) */
  --fall-bg:     rgba(30,158,92,0.07);
  --fall-soft:   #e8f6ef;
  --amber:       #e8a33d;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card:  0 1px 2px rgba(20,40,60,0.04), 0 2px 8px rgba(20,40,60,0.04);
  --shadow-hover: 0 4px 16px rgba(20,40,60,0.08);
  --ease: 180ms cubic-bezier(0.4,0,0.2,1);
  --font: 'Inter', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}
[data-theme="dark"] {
  --canvas:      #10151c;
  --canvas-deep: #0b0f14;
  --card:        #171d26;
  --hover:       #1d2530;
  --line:        #242e3a;
  --line-strong: #35424f;
  --text:        #e3e9f0;
  --text-2:      #93a1b1;
  --text-3:      #55636f;
  --blue:        #4a9fd4;
  --blue-light:  rgba(74,159,212,0.10);
  --blue-soft:   #14293a;
  --rise:        #f0716a;
  --rise-bg:     rgba(240,113,106,0.10);
  --rise-soft:   #3a1e1c;
  --fall:        #4ecb8d;
  --fall-bg:     rgba(78,203,141,0.10);
  --fall-soft:   #163026;
  --amber:       #e8b25a;
  --shadow-card:  0 1px 2px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.2);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--canvas);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background var(--ease), color var(--ease);
}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* 背景：极淡网格 */
.bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:56px 56px;
  opacity:0.55;
}

/* ============================================================
   Header
   ============================================================ */
.header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 22px;
  background:rgba(243,245,248,0.92);
  backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
  transition:background var(--ease);
}
[data-theme="dark"] .header{background:rgba(16,21,28,0.92)}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.back-btn{
  width:32px;height:32px;flex-shrink:0;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--card);color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:all var(--ease);
}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
.back-btn svg{width:15px;height:15px}
.header-title{
  font-size:14px;font-weight:700;letter-spacing:-0.2px;
  display:flex;align-items:center;gap:8px;
}
.header-title .logo-mark{
  width:24px;height:24px;border-radius:7px;
  background:var(--blue);display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:800;
}
.header-sub{font-size:11px;color:var(--text-3);white-space:nowrap;margin-left:4px}
.header-right{display:flex;align-items:center;gap:8px}
.header-time{
  font-size:12px;color:var(--text-2);font-family:var(--mono);
  background:var(--card);border:1px solid var(--line);
  padding:4px 10px;border-radius:var(--radius-sm);font-variant-numeric:tabular-nums;
}
.btn-refresh{
  width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--card);
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--ease);
}
.btn-refresh:hover{border-color:var(--blue);color:var(--blue)}
.btn-refresh.spinning .refresh-icon{animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-refresh svg{width:14px;height:14px}

/* ============================================================
   Main
   ============================================================ */
.main{
  position:relative;z-index:1;
  padding:24px 22px 56px;max-width:1280px;margin:0 auto;width:100%;
}
.app{display:flex;flex-direction:column;min-height:100vh}

/* ---- Loading ---- */
.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:110px 20px;gap:14px;color:var(--text-3);
}
.spinner{
  width:26px;height:26px;border:3px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin 0.7s linear infinite;
}
.loading-state .lt{font-size:13px;font-weight:600;color:var(--text-2)}

/* ---- Section title ---- */
.section-title{
  font-size:12px;font-weight:700;color:var(--text-2);
  letter-spacing:0.02em;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-title .bar{
  width:3px;height:14px;border-radius:2px;background:var(--blue);
  flex-shrink:0;
}

/* ============================================================
   Index cards — 主屏 + 小卡
   ============================================================ */
.indices{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-bottom:26px;
}
.index-card{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 18px;
  transition:all var(--ease);
  overflow:hidden;
}
.index-card:hover{
  border-color:var(--line-strong);box-shadow:var(--shadow-hover);
  transform:translateY(-2px);
}
.index-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--line);opacity:0;
}
.index-card.up::before{background:var(--rise);opacity:1}
.index-card.down::before{background:var(--fall);opacity:1}
.idx-name{
  font-size:10px;color:var(--text-3);letter-spacing:0.12em;
  text-transform:uppercase;margin-bottom:8px;font-weight:600;
}
.idx-price{
  font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-0.02em;line-height:1;
}
.idx-price.up{color:var(--rise)}
.idx-price.down{color:var(--fall)}
.idx-change{
  font-size:12px;font-weight:700;margin-top:10px;
  display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;
}
.idx-change.up{color:var(--rise)}
.idx-change.down{color:var(--fall)}
.idx-change .chg-extra{font-weight:500;font-size:11px;color:var(--text-3)}

/* ---- 主屏：第一个指数 ---- */
.index-card:first-child{
  grid-column:span 2;
  background:
    linear-gradient(135deg, var(--blue-soft), var(--card) 55%);
  border:1px solid var(--blue);
  border-radius:var(--radius-lg);
  padding:24px 26px;
  display:flex;flex-direction:column;justify-content:center;
}
.index-card:first-child::before{
  width:4px;background:var(--blue);opacity:1;
}
.index-card:first-child .idx-name{
  font-size:11px;color:var(--blue);letter-spacing:0.16em;margin-bottom:14px;
  font-weight:700;
}
.index-card:first-child .idx-price{
  font-size:clamp(40px, 5vw, 56px);
  font-weight:800;
}
.index-card:first-child .idx-change{font-size:15px;margin-top:14px}
.index-card:first-child .idx-change .chg-extra{font-size:13px}

/* ============================================================
   双栏：板块 / 个股
   ============================================================ */
.double-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}

.table-wrap{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-md);overflow:hidden;
  transition:border-color var(--ease);
}
.table-wrap:hover{border-color:var(--line-strong)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:10px 16px;
  font-size:10px;font-weight:700;color:var(--text-3);
  letter-spacing:0.1em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
  background:var(--canvas);
}
thead th:last-child,tbody td:last-child{text-align:right}
thead th:nth-child(3),tbody td:nth-child(3){text-align:right}
tbody tr{border-bottom:1px solid var(--line);transition:background var(--ease)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--hover)}
tbody td{padding:10px 16px;vertical-align:middle;font-size:12.5px}
td.name-col{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.code-col{font-family:var(--mono);font-size:11px;color:var(--text-3)}
td.num-col{font-family:var(--mono);font-size:13.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
td.num-col.up{color:var(--rise)}
td.num-col.down{color:var(--fall)}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;
}
.badge svg{width:11px;height:11px}
.badge.up{background:var(--rise-bg);color:var(--rise)}
.badge.down{background:var(--fall-bg);color:var(--fall)}

/* ============================================================
   新闻 — 两栏卡片
   ============================================================ */
.news-section{margin-bottom:26px}
.news-list{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.news-item{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 16px;
  cursor:pointer;transition:all var(--ease);
}
.news-item:hover{
  border-color:var(--blue);box-shadow:var(--shadow-hover);
  transform:translateY(-2px);
}
.news-item .news-title{font-size:12.5px;font-weight:600;line-height:1.55;color:var(--text)}
.news-item:hover .news-title{color:var(--blue)}
.news-item .news-meta{display:flex;align-items:center;gap:14px;margin-top:8px}
.news-item .nsource{
  font-size:10px;color:var(--blue);font-weight:700;letter-spacing:0.06em;
}
.news-item .ntime{font-size:11px;color:var(--text-3);font-family:var(--mono)}

/* ---- Toast ---- */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:#fff;
  box-shadow:0 4px 16px rgba(20,40,60,0.2);pointer-events:auto;
  animation:toastIn 0.3s var(--ease);
}
.toast.success{background:var(--fall)}
.toast.error{background:var(--rise)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   Responsive
   ============================================================ */
@media(max-width:900px){
  .indices{grid-template-columns:repeat(2,1fr);gap:10px}
  .index-card:first-child{grid-column:span 2}
  .index-card:first-child .idx-price{font-size:44px}
  .double-col{grid-template-columns:1fr}
  .news-list{grid-template-columns:1fr}
  .main{padding:18px 14px 40px}
  .header{padding:0 14px}
  .header-sub{display:none}
  .header-time{font-size:11px}
}
@media(max-width:480px){
  .indices{grid-template-columns:1fr}
  .index-card:first-child{grid-column:span 1}
  .index-card:first-child .idx-price{font-size:40px}
  td.code-col{display:none}
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="back-btn" title="返回首页" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <span class="header-title"><span class="logo-mark">市</span>股市情报站</span>
      <span class="header-sub">Market Dashboard</span>
    </div>
    <div class="header-right">
      <span class="header-time" id="headerTime"></span>
      <button class="btn-refresh" id="refreshBtn" title="刷新数据" aria-label="刷新数据">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="btn-refresh" id="themeToggle" title="切换暗色模式" aria-label="切换暗色模式">
        <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="main">
    <!-- Loading -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <span class="lt">正在采集行情数据...</span>
    </div>

    <!-- Data Section -->
    <div id="dataSection" style="display:none">
      <div class="section-title"><span class="bar"></span>大盘指数</div>
      <div class="indices" id="indexContainer"></div>

      <div class="double-col">
        <div>
          <div class="section-title"><span class="bar"></span>热门板块</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>板块</th><th>代码</th><th>最新价</th><th>涨跌幅</th></tr></thead>
              <tbody id="sectorBody"></tbody>
            </table>
          </div>
        </div>
        <div>
          <div class="section-title"><span class="bar"></span>热门个股</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>名称</th><th>代码</th><th>最新价</th><th>涨跌幅</th></tr></thead>
              <tbody id="stockBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="news-section">
        <div class="section-title"><span class="bar"></span>财经要闻</div>
        <div class="news-list" id="newsContainer"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
  'use strict';

  /* Theme */
  var theme = localStorage.getItem('hermes-theme') || 'light';
  function applyTheme(t) {
    if (t === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('iconSun').style.display = 'none';
      document.getElementById('iconMoon').style.display = 'block';
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('iconSun').style.display = 'block';
      document.getElementById('iconMoon').style.display = 'none';
    }
  }
  applyTheme(theme);
  document.getElementById('themeToggle').addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    theme = isDark ? 'light' : 'dark';
    localStorage.setItem('hermes-theme', theme);
    applyTheme(theme);
  });

  // Clock
  function updateClock() {
    var now = new Date();
    document.getElementById('headerTime').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Toast
  function showToast(msg, type) {
    type = type || 'success';
    var container = document.getElementById('toastContainer');
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function() {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s';
      setTimeout(function() { el.remove(); }, 300);
    }, 3000);
  }

  // SVG arrow icons for badges
  var arrowUp = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  var arrowDown = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>';

  // Data
  var DOM = {
    loadingState: document.getElementById('loadingState'),
    dataSection: document.getElementById('dataSection'),
    indexContainer: document.getElementById('indexContainer'),
    sectorBody: document.getElementById('sectorBody'),
    stockBody: document.getElementById('stockBody'),
    newsContainer: document.getElementById('newsContainer'),
    refreshBtn: document.getElementById('refreshBtn'),
  };
  var isCollecting = false;

  function collectData() {
    if (isCollecting) return;
    isCollecting = true;
    DOM.refreshBtn.classList.add('spinning');

    fetch('/api/stock/hot').then(function(r) { return r.json(); }).then(function(data) {
      if (data.code !== 0) throw new Error(data.msg || '接口异常');
      renderData(data);
      DOM.loadingState.style.display = 'none';
      DOM.dataSection.style.display = 'block';
      showToast('数据已更新', 'success');
    }).catch(function(e) {
      console.error('[Stock]', e);
      if (DOM.dataSection.style.display === 'none') {
        DOM.loadingState.innerHTML =
          '<div style="font-size:40px;margin-bottom:8px;line-height:1;color:var(--rise)">&#x26A0;</div>' +
          '<span class="lt">数据加载失败</span>' +
          '<span style="font-size:12px;color:var(--text-3)">' + (e.message || '网络异常') + '</span>' +
          '<button onclick="location.reload()" style="margin-top:20px;height:38px;padding:0 28px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all 200ms ease">&#x21BB; 重试</button>';
      } else {
        showToast('刷新失败: ' + (e.message || '网络异常'), 'error');
      }
    }).finally(function() {
      isCollecting = false;
      DOM.refreshBtn.classList.remove('spinning');
    });
  }

  function renderData(d) {
    // Indices
    var idxHtml = '';
    (d.indices || []).forEach(function(idx) {
      var up = idx.changePct >= 0;
      idxHtml += '<div class="index-card ' + (up ? 'up' : 'down') + '">' +
        '<div class="idx-name">' + esc(idx.name) + '</div>' +
        '<div class="idx-price ' + (up ? 'up' : 'down') + '">' + fmtPrice(idx.price) + '</div>' +
        '<div class="idx-change ' + (up ? 'up' : 'down') + '">' +
          (up ? arrowUp : arrowDown) + ' ' + (up ? '+' : '') + idx.changePct.toFixed(2) + '%' +
          ' <span class="chg-extra">' +
          (up ? '+' : '') + fmtPrice(idx.change) + '</span>' +
        '</div></div>';
    });
    DOM.indexContainer.innerHTML = idxHtml || '<div style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:30px">暂无指数数据</div>';

    // Sectors
    DOM.sectorBody.innerHTML = '';
    (d.sectors || []).forEach(function(s) {
      var up = s.changePct >= 0;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="name-col">' + esc(s.name) + '</td>' +
        '<td class="code-col">' + esc(s.code) + '</td>' +
        '<td class="num-col ' + (up ? 'up' : 'down') + '">' + fmtPrice(s.price) + '</td>' +
        '<td class="num-col"><span class="badge ' + (up ? 'up' : 'down') + '">' +
          (up ? arrowUp : arrowDown) + ' ' + (up ? '+' : '') + s.changePct.toFixed(2) + '%</span></td>';
      DOM.sectorBody.appendChild(tr);
    });

    // Stocks
    DOM.stockBody.innerHTML = '';
    (d.stocks || []).forEach(function(st) {
      var up = st.changePct >= 0;
      var tr2 = document.createElement('tr');
      tr2.innerHTML =
        '<td class="name-col">' + esc(st.name) + '</td>' +
        '<td class="code-col">' + esc(st.code) + '</td>' +
        '<td class="num-col ' + (up ? 'up' : 'down') + '">' + fmtPrice(st.price) + '</td>' +
        '<td class="num-col"><span class="badge ' + (up ? 'up' : 'down') + '">' +
          (up ? arrowUp : arrowDown) + ' ' + (up ? '+' : '') + st.changePct.toFixed(2) + '%</span></td>';
      DOM.stockBody.appendChild(tr2);
    });

    // News
    DOM.newsContainer.innerHTML = '';
    (d.news || []).forEach(function(n) {
      if (!n.title) return;
      var div = document.createElement('div');
      div.className = 'news-item';
      div.innerHTML =
        '<div class="news-title">' + esc(n.title) + '</div>' +
        '<div class="news-meta"><span class="nsource">' + esc(n.source || '') + '</span>' +
        '<span class="ntime">' + esc(n.time || '') + '</span></div>';
      if (n.url) div.style.cursor = 'pointer';
      div.addEventListener('click', function() { if (n.url) window.open(n.url, '_blank'); });
      DOM.newsContainer.appendChild(div);
    });
  }

  function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function fmtPrice(v) { if (v == null) return '-'; return v.toFixed(2); }

  DOM.refreshBtn.addEventListener('click', collectData);
  collectData();
})();
</script>
</body>
</html>
